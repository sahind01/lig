# .github/workflows/mutlu_tv_lig_veri_cekici.yml
name: Mutlu TV Lig Veri Çekici - GELİŞMİŞ

on:
  schedule:
    - cron: '0 */6 * * *'  # Her 6 saatte bir
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mutlu_tv_lig_veri_cekici.py'

jobs:
  veri_cekimi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Python 3.11 Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml html5lib
        pip install --upgrade requests beautifulsoup4

    - name: Çalışma Dizini Kontrolü
      run: |
        echo "📁 Çalışma dizini: $(pwd)"
        echo "📄 Dosyalar:"
        ls -la

    - name: Veri Çekme Script'ini Çalıştır
      id: veri_cek
      continue-on-error: true
      run: |
        python mutlu_tv_lig_veri_cekici.py 2>&1 | tee output.log
      env:
        USER_AGENT: "MutluTVLigBot/2.0 (+https://mutlutvlig.com)"
        PYTHONUNBUFFERED: "1"

    - name: Log Dosyasını Kontrol Et
      run: |
        if [ -f "mutlu_tv_lig.log" ]; then
          echo "📋 Log dosyası içeriği:"
          cat mutlu_tv_lig.log
        fi
        if [ -f "output.log" ]; then
          echo "📋 Çıktı logu:"
          tail -n 20 output.log
        fi

    - name: JSON Verisini Kontrol Et
      id: check_json
      run: |
        if [ -f "mutlu_tv_lig_verisi.json" ]; then
          echo "✅ JSON dosyası bulundu."
          echo "📊 Dosya boyutu: $(du -h mutlu_tv_lig_verisi.json | cut -f1)"
          echo "📈 JSON içeriği özeti:"
          python -c "import json; d=json.load(open('mutlu_tv_lig_verisi.json')); print(f'Toplam takım: {len(d.get(\"puan_durumu\", []))}'); print(f'Güncelleme: {d.get(\"guncelleme_tarihi\", \"-\")}')"
          echo "::set-output name=success::true"
        else
          echo "❌ JSON dosyası bulunamadı!"
          echo "::set-output name=success::false"
          exit 1
        fi

    - name: Veriyi Commit Et (Değişiklik Varsa)
      if: steps.check_json.outputs.success == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action [Bot]"
        git add mutlu_tv_lig_verisi.json
        git commit -m "🔄 Veri güncellendi: $(date +'%Y-%m-%d %H:%M:%S')" || echo "✅ Değişiklik yok, commit atlandı."

    - name: Değişiklikleri Push Et
      if: steps.check_json.outputs.success == 'true'
      uses: ad-m/github-push-action@v0.8.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
        force: false

    - name: Başarısız Durumda Uyarı
      if: failure() || steps.veri_cek.outcome == 'failure'
      run: |
        echo "::error::⚠️ Veri çekme işlemi başarısız oldu!"
        echo "Logları inceleyin:"
        if [ -f "mutlu_tv_lig.log" ]; then
          cat mutlu_tv_lig.log
        fi
        # Webhook bildirimi (opsiyonel)
        # curl -X POST -H 'Content-type: application/json' --data '{"text":"⚠️ Mutlu TV Lig veri çekici başarısız!"}' ${{ secrets.WEBHOOK_URL }}

    - name: Artifact Olarak Kaydet
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mutlu-tv-lig-logs
        path: |
          mutlu_tv_lig_verisi.json
          *.log
          output.log
        retention-days: 7
