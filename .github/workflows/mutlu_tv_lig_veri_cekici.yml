# .github/workflows/mutlu_tv_lig_veri_cekici.yml
name: Mutlu TV Lig Veri Çekici - GERÇEK VERİ

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mutlu_tv_lig_veri_cekici.py'

jobs:
  veri_cekimi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Bağımlılıkları Yükle
      run: |
        pip install --upgrade pip
        pip install requests beautifulsoup4 lxml html5lib

    - name: Veri Çek
      id: veri_cek
      run: |
        python mutlu_tv_lig_veri_cekici.py 2>&1 | tee output.log
      env:
        USER_AGENT: "MutluTVLigBot/5.0 (+https://mutlutvlig.com)"
        PYTHONUNBUFFERED: "1"

    - name: JSON Kontrol
      id: check_json
      run: |
        if [ -f "mutlu_tv_lig_verisi.json" ]; then
          echo "✅ JSON dosyası bulundu."
          python -c "import json; d=json.load(open('mutlu_tv_lig_verisi.json')); assert len(d.get('puan_durumu', [])) >= 18, 'Eksik takım'"
          echo "::set-output name=success::true"
        else
          echo "❌ JSON dosyası bulunamadı!"
          echo "::set-output name=success::false"
          exit 1
        fi

    - name: Commit ve Push
      if: steps.check_json.outputs.success == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action [Bot]"
        git add mutlu_tv_lig_verisi.json
        git commit -m "🔄 Gerçek veri güncellendi: $(date +'%Y-%m-%d %H:%M:%S')" || echo "Değişiklik yok"

    - name: Push Et
      if: steps.check_json.outputs.success == 'true'
      uses: ad-m/github-push-action@v0.8.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}

    - name: Artifact Kaydet
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mutlu-tv-lig-logs
        path: |
          mutlu_tv_lig_verisi.json
          *.log
        retention-days: 7
